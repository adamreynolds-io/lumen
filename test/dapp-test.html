<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen dApp Connector Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { margin-bottom: 10px; }
    .subtitle { color: #888; margin-bottom: 20px; }
    h2 { margin: 20px 0 10px; font-size: 16px; color: #888; }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .status.connected { background: #1a3a2a; color: #4caf50; }
    .status.disconnected { background: #3a1a1a; color: #f44336; }
    .status.pending { background: #3a3a1a; color: #f0ad4e; }
    .wallet-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #2a2a3e;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .wallet-info img {
      width: 48px;
      height: 48px;
    }
    .wallet-info .details {
      flex: 1;
    }
    .wallet-info .name {
      font-size: 18px;
      font-weight: bold;
    }
    .wallet-info .meta {
      font-size: 12px;
      color: #888;
    }
    button {
      padding: 10px 16px;
      margin: 4px;
      font-size: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.connect-btn {
      background: linear-gradient(135deg, #e94560, #764ba2);
      font-size: 16px;
      padding: 12px 24px;
    }
    .result {
      background: #2a2a3e;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }
    .error { color: #f44336; }
    .success { color: #4caf50; }
    .actions { margin: 10px 0; }
    input, select {
      padding: 8px;
      font-size: 14px;
      background: #2a2a3e;
      border: 1px solid #444;
      border-radius: 4px;
      color: #eee;
    }
    input { width: 300px; }
    select { width: 150px; }
    .section {
      background: #16162a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>🌙 Lumen dApp Connector Test</h1>
  <p class="subtitle">Testing @midnight-ntwrk/dapp-connector-api implementation</p>

  <div id="status" class="status disconnected">
    Checking for Lumen wallet...
  </div>

  <!-- Wallet detection section -->
  <div id="wallet-section" class="section hidden">
    <div class="wallet-info">
      <img id="wallet-icon" src="" alt="Wallet icon">
      <div class="details">
        <div class="name" id="wallet-name">Wallet Name</div>
        <div class="meta">
          <span id="wallet-rdns">rdns</span> ·
          API v<span id="wallet-api-version">0.0.0</span>
        </div>
      </div>
      <button id="btn-connect" class="connect-btn">Connect to DevNet</button>
    </div>

    <div class="actions">
      <label>Network: </label>
      <select id="network-select">
        <option value="devnet" selected>DevNet</option>
        <option value="localnet">Localnet</option>
        <option value="qanet">QANET</option>
        <option value="preview">Preview</option>
        <option value="preprod">PreProd</option>
      </select>
    </div>
  </div>

  <!-- Connected API section -->
  <div id="connected-section" class="section hidden">
    <h2>Addresses</h2>
    <div class="actions">
      <button id="btn-dust-address">getDustAddress()</button>
      <button id="btn-unshielded-address">getUnshieldedAddress()</button>
    </div>

    <h2>Balances</h2>
    <div class="actions">
      <button id="btn-dust-balance">getDustBalance()</button>
      <button id="btn-shielded-balances">getShieldedBalances()</button>
      <button id="btn-unshielded-balances">getUnshieldedBalances()</button>
    </div>

    <h2>Signing</h2>
    <div class="actions">
      <input type="text" id="sign-data-input" placeholder="Data to sign" value="Hello, Midnight!">
      <select id="sign-encoding">
        <option value="text">text</option>
        <option value="hex">hex</option>
        <option value="base64">base64</option>
      </select>
      <button id="btn-sign-data">signData()</button>
    </div>

    <h2>Configuration</h2>
    <div class="actions">
      <button id="btn-configuration">getConfiguration()</button>
      <button id="btn-connection-status">getConnectionStatus()</button>
      <button id="btn-tx-history">getTxHistory(0, 10)</button>
    </div>
  </div>

  <h2>Result</h2>
  <div id="result" class="result">Results will appear here...</div>

  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const walletSection = document.getElementById('wallet-section');
    const connectedSection = document.getElementById('connected-section');

    let connectedAPI = null;
    let initialAPI = null;

    function showResult(label, data, isError = false) {
      const className = isError ? 'error' : 'success';
      let displayData;
      try {
        // Handle BigInt serialization
        displayData = JSON.stringify(data, (key, value) =>
          typeof value === 'bigint' ? value.toString() + 'n' : value
        , 2);
      } catch (e) {
        displayData = String(data);
      }
      resultEl.innerHTML = `<span class="${className}">${label}:</span>\n${displayData}`;
      console.log(label, data);
    }

    function updateStatus(message, type = 'pending') {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    async function callMethod(name, fn) {
      resultEl.innerHTML = `Calling ${name}...`;
      try {
        const result = await fn();
        showResult(name, result);
        return result;
      } catch (err) {
        const errorInfo = {
          message: err.message,
          code: err.code,
          reason: err.reason,
          type: err.type
        };
        showResult(`${name} ERROR`, errorInfo, true);
        throw err;
      }
    }

    // Wait for Lumen to be ready
    function waitForLumen(timeout = 3000) {
      return new Promise((resolve) => {
        // Check if already available
        if (window.midnight && window.midnight['lumen-wallet']) {
          resolve(window.midnight['lumen-wallet']);
          return;
        }

        const handler = (event) => {
          window.removeEventListener('midnight#ready', handler);
          if (window.midnight && window.midnight['lumen-wallet']) {
            resolve(window.midnight['lumen-wallet']);
          } else {
            resolve(null);
          }
        };
        window.addEventListener('midnight#ready', handler);

        setTimeout(() => {
          window.removeEventListener('midnight#ready', handler);
          if (window.midnight && window.midnight['lumen-wallet']) {
            resolve(window.midnight['lumen-wallet']);
          } else {
            resolve(null);
          }
        }, timeout);
      });
    }

    function setupConnectedHandlers() {
      // Address methods
      document.getElementById('btn-dust-address').onclick = () =>
        callMethod('getDustAddress()', () => connectedAPI.getDustAddress());

      document.getElementById('btn-unshielded-address').onclick = () =>
        callMethod('getUnshieldedAddress()', () => connectedAPI.getUnshieldedAddress());

      // Balance methods
      document.getElementById('btn-dust-balance').onclick = () =>
        callMethod('getDustBalance()', () => connectedAPI.getDustBalance());

      document.getElementById('btn-shielded-balances').onclick = () =>
        callMethod('getShieldedBalances()', () => connectedAPI.getShieldedBalances());

      document.getElementById('btn-unshielded-balances').onclick = () =>
        callMethod('getUnshieldedBalances()', () => connectedAPI.getUnshieldedBalances());

      // Signing
      document.getElementById('btn-sign-data').onclick = () => {
        const data = document.getElementById('sign-data-input').value;
        const encoding = document.getElementById('sign-encoding').value;
        callMethod('signData()', () => connectedAPI.signData(data, {
          encoding,
          keyType: 'unshielded'
        }));
      };

      // Configuration
      document.getElementById('btn-configuration').onclick = () =>
        callMethod('getConfiguration()', () => connectedAPI.getConfiguration());

      document.getElementById('btn-connection-status').onclick = () =>
        callMethod('getConnectionStatus()', () => connectedAPI.getConnectionStatus());

      document.getElementById('btn-tx-history').onclick = () =>
        callMethod('getTxHistory(0, 10)', () => connectedAPI.getTxHistory(0, 10));
    }

    // Initialize
    async function init() {
      updateStatus('Waiting for Lumen wallet...', 'pending');

      initialAPI = await waitForLumen();

      if (!initialAPI) {
        updateStatus('✗ Lumen wallet not detected. Is the extension installed?', 'disconnected');
        return;
      }

      // Show wallet info
      document.getElementById('wallet-icon').src = initialAPI.icon;
      document.getElementById('wallet-name').textContent = initialAPI.name;
      document.getElementById('wallet-rdns').textContent = initialAPI.rdns;
      document.getElementById('wallet-api-version').textContent = initialAPI.apiVersion;

      walletSection.classList.remove('hidden');
      updateStatus(`✓ ${initialAPI.name} wallet detected`, 'connected');

      // Update connect button text based on network selection
      const networkSelect = document.getElementById('network-select');
      const connectBtn = document.getElementById('btn-connect');

      networkSelect.onchange = () => {
        connectBtn.textContent = `Connect to ${networkSelect.options[networkSelect.selectedIndex].text}`;
      };

      // Connect button handler
      connectBtn.onclick = async () => {
        const networkId = networkSelect.value;
        connectBtn.disabled = true;
        connectBtn.textContent = 'Connecting...';

        try {
          connectedAPI = await callMethod(`connect('${networkId}')`, () =>
            initialAPI.connect(networkId)
          );

          connectedSection.classList.remove('hidden');
          connectBtn.textContent = `Connected to ${networkSelect.options[networkSelect.selectedIndex].text}`;
          updateStatus(`✓ Connected to ${networkId}`, 'connected');

          setupConnectedHandlers();
        } catch (err) {
          connectBtn.disabled = false;
          connectBtn.textContent = `Connect to ${networkSelect.options[networkSelect.selectedIndex].text}`;
          updateStatus(`✗ Connection failed: ${err.message}`, 'disconnected');
        }
      };
    }

    init();
  </script>
</body>
</html>
