services:
  node:
    image: ghcr.io/midnight-ntwrk/midnight-node:0.20.0
    ports:
      - "127.0.0.1:9944:9944"
    environment:
      - CFG_PRESET=dev
      - SIDECHAIN_BLOCK_BENEFICIARY=04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    volumes:
      - node-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  indexer:
    image: ghcr.io/midnight-ntwrk/indexer-standalone:3.0.0
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      RUST_LOG: "indexer=debug,chain_indexer=debug,indexer_api=debug,wallet_indexer=debug,indexer_common=debug,fastrace_opentelemetry=off,info"
      APP__INFRA__NODE__URL: "ws://node:9944"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__STORAGE__PASSWORD: "indexer"
      APP__INFRA__PUB_SUB__PASSWORD: "indexer"
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: "indexer"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
    depends_on:
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proof-server:
    image: ghcr.io/midnight-ntwrk/proof-server:7.0.0
    ports:
      - "127.0.0.1:6300:6300"
    environment:
      - RUST_BACKTRACE=full
      - RUST_LOG=info,proof_server=debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  node-data:
    name: lumen-node-data
